[project]
name = "locallery"
version = "0.2.0"
description = "Local semantic image gallery with direct Transformers inference"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "PyYAML>=6,<7",
  "numpy>=2,<3", "Pillow>=11,<13", "usearch>=2.26,<3",
  "transformers>=5.19,<6", "accelerate>=1,<2",
]

[project.optional-dependencies]
cpu = ["torch>=2.8", "torchvision>=0.23"]
cuda = ["torch>=2.8", "torchvision>=0.23"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/locallery"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cuda", extra = "cuda" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cuda", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
